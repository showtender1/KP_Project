<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <script>
    (function () {
      var path = location.pathname.replace(/\/+/g, '/');
      var baseHref;
      if (path === '/' || path === '') {
        baseHref = '/';
      } else if (path.endsWith('/')) {
        baseHref = path;
      } else if (/\.html$/i.test(path)) {
        baseHref = path.replace(/[^/]+$/, '');
      } else {
        baseHref = path + '/';
      }
      var b = document.createElement('base');
      b.href = baseHref;
      document.head.insertBefore(b, document.head.firstChild);
    })();
  </script>
  <title>KP Project</title>
  <link rel="stylesheet" href="./style.css" />
</head>
<body>

  <div id="loading">
    <div class="loading-title">KP Project</div>
    <div class="loading-spinner"></div>
    <div class="loading-bar-track">
      <div id="loading-bar"></div>
    </div>
    <div id="loading-text">로딩 중... 0%</div>
  </div>

  <div id="transition-overlay">
    <div class="loading-title">요트 내부로 이동중</div>
    <div class="loading-spinner"></div>
    <div class="loading-bar-track">
      <div id="transition-bar"></div>
    </div>
    <div id="transition-pct">0%</div>
  </div>


  <div id="click-hint">
    <div id="click-hint-text">클릭하여 시작</div>
  </div>

  <div id="coords"></div>

  <div id="crosshair">+</div>

  <div id="boat-entry-popup">화살표를 따라 요트 내부로 진입하세요</div>
  <div id="portal-tooltip">클릭하여 요트 내부로 진입하세요</div>

  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.160/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160/examples/jsm/"
    }
  }
  </script>

  <script type="module" src="./main.js"></script>
</body>
</html>
