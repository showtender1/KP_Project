<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <script>
    (function () {
      var path = location.pathname.replace(/\/+/g, '/');
      var baseHref;
      if (path === '/' || path === '') {
        baseHref = '/';
      } else if (path.endsWith('/')) {
        baseHref = path;
      } else if (/\.html$/i.test(path)) {
        baseHref = path.replace(/[^/]+$/, '');
      } else {
        baseHref = path + '/';
      }
      var b = document.createElement('base');
      b.href = baseHref;
      document.head.insertBefore(b, document.head.firstChild);
    })();
  </script>
  <title>KP Project</title>
  <link rel="stylesheet" href="./style.css" />
</head>
<body>

  <div id="loading">
    <div class="loading-title">KP Project</div>
    <div class="loading-spinner"></div>
    <div class="loading-bar-track">
      <div id="loading-bar"></div>
    </div>
    <div id="loading-text">로딩 중... 0%</div>
  </div>

  <div id="transition-overlay">
    <div id="transition-text">
      <div class="transition-spinner"></div>
      <div style="display:flex;flex-direction:column;align-items:center;gap:10px;">
        <span id="transition-msg">이동 중...</span>
        <span id="transition-pct" style="display:none;font-size:13px;opacity:0.7;"></span>
      </div>
    </div>
  </div>

  <div id="ui">
    <button id="enterClassroom">선박 내부로 이동</button>
    <button id="returnBoat"  style="display:none">보트로 돌아가기</button>
    <button id="firstView"   style="display:none">1인칭 시점</button>
    <button id="freeView"    style="display:none">자유 시점</button>
  </div>

  <div id="click-hint">
    <div id="click-hint-text">클릭하여 시작</div>
  </div>

  <div id="coords"></div>

  <div id="crosshair">+</div>

  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.160/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160/examples/jsm/",
      "three-mesh-bvh": "https://cdn.jsdelivr.net/npm/three-mesh-bvh@0.6/build/index.module.js"
    }
  }
  </script>

  <script type="module" src="./main.js"></script>
</body>
</html>
